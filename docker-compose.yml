services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    volumes:
      - ./src:/app/src
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: ["rq", "worker", "-u", "redis://redis:6379/0"]

  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"

